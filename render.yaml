# Backup host for PyLens: a Render static site serving the same dist/ bundle.
# Vercel is primary (vercel.json); this exists so a dead deploy in the middle of
# a class is a DNS change rather than a rebuild.
services:
  - type: web
    name: pylens
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      # Cross-origin isolation. Without both of these SharedArrayBuffer is
      # unavailable, and Stop silently degrades from a KeyboardInterrupt into
      # terminating and re-booting the interpreter (~3s of dead air in a class).
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Vite's own assets carry a content hash, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The interpreter is ~13 MB and does not change between deploys, but its
      # filenames are not versioned — so a month, not a year. Bumping Pyodide
      # means the first load after the deploy may still be the old runtime.
      - path: /pyodide/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /pyodide/*.wasm
        name: Content-Type
        value: application/wasm
